[package]
name = "agentica-runtime"
version = "0.1.0"
description = "Shared Agentica runtime and detached local backend"
edition = "2021"
license = "MIT"

[features]
bundled-frontend = []

[[bin]]
name = "agentica-backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
dirs = "7"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
libc = "0.2"
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
