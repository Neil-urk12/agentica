name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are cancelled: a PR's path filter covers its whole diff, while a
  # cancelled push run would leave that push's commits unchecked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  javascript:
    name: TypeScript and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm -r build
      - run: pnpm test:unit

  changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            native:
              - 'packages/agent-runtime/**'
              - 'apps/desktop/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'tests/fixtures/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  native:
    name: Native check (${{ matrix.os }})
    needs: changes
    # Pushes to main always run; elsewhere only when Rust or native build inputs changed.
    if: needs.changes.outputs.native == 'true' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        # Windows runs only for main and pull requests into main.
        os: ${{ fromJSON(((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')) && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # Only main and develop write the cache; PR runs read it without evicting it.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libglib2.0-dev libssl-dev librsvg2-dev build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:rust
      - run: pnpm test:rust:unit
      # A release build only on main; elsewhere a debug build reuses the artifacts above.
      - name: Desktop build (release)
        if: github.ref == 'refs/heads/main'
        run: pnpm build:desktop
      - name: Desktop build (debug)
        if: github.ref != 'refs/heads/main'
        run: pnpm build:desktop --debug

  coverage:
    name: Coverage
    # Pushes only: the badge reads the default branch, so PR runs would spend a
    # second instrumented Rust build without changing it.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Codecov authenticates the upload with a GitHub OIDC token, so no
      # CODECOV_TOKEN secret is needed once the Codecov app is installed.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Install Linux native libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libglib2.0-dev libssl-dev librsvg2-dev build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Rust coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --locked -p agentica-runtime --features bundled-frontend --lcov --output-path coverage/rust.lcov
      - name: Frontend coverage
        run: pnpm test:unit:coverage
      - uses: codecov/codecov-action@v7
        with:
          files: coverage/rust.lcov,coverage/js.lcov
          use_oidc: true
